# ─── Serveur ────────────────────────────────────────────────
server.port=8080

# ─── MongoDB ────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/airbnb_clone
spring.data.mongodb.database=airbnb_clone

# ─── Neo4j ──────────────────────────────────────────────────
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

# ─── Logs ───────────────────────────────────────────────────
logging.level.org.springframework.data.mongodb=WARN
logging.level.ma.airbnbclone=INFO
logging.level.org.springframework.data.neo4j=WARN

# ─── Jackson (dates en ISO-8601) ────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
